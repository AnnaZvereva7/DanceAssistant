<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>DanceAssistant - UserPage</title>
    <style>
        :root{
          --bg:#f6f8fc;
          --card:#ffffff;
          --card2:#f9fbff;
          --text:#1f2937;
          --muted:#6b7280;
          --border:rgba(15,23,42,.12);
          --shadow:0 10px 30px rgba(15,23,42,.08);
          --radius:16px;
          --accent:#3b82f6;
          --accent2:#22c55e;
          --status-bg:#f3f4f6;
        }

        *{box-sizing:border-box}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
          color:var(--text);
          background:
              radial-gradient(1200px 600px at 10% 0%, rgba(59,130,246,.10), transparent 60%),
              radial-gradient(900px 500px at 90% 20%, rgba(34,197,94,.08), transparent 55%),
              var(--bg);
          min-height:100vh;
          padding:24px;
        }

        h1{
          margin: 18px 0 12px;
          font-size: 28px;
          letter-spacing:.2px;
        }

        .page{
          max-width: 1100px;
          margin: 0 auto;
        }

        /* Top user panel */
        .user-panel{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:16px;
          padding:16px 18px;
          background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(248,250,252,.92));
          border:1px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
        }
        .user-info{
          display:flex;
          flex-direction:column;
          gap:4px;
        }
        #userNameSession{
          font-weight:700;
          font-size:16px;
        }
        #statusSession{
          color:var(--muted);
          font-size:13px;
        }

        .logout-btn{
          appearance:none;
          border:1px solid var(--border);
           background:#fff;
          color: var(--text);
          padding:10px 14px;
          border-radius: 12px;
          cursor:pointer;
          transition:.15s ease;
        }
        .logout-btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
        .logout-btn:active{ transform: translateY(0px); }

        /* Tabs */
        .tabs{
          display:flex;
          flex-wrap:wrap;
          gap:10px;
          margin: 14px 0 18px;
        }
        .tab-btn{
          border:1px solid var(--border);
          background:#fff;
          color: var(--text);
          padding:10px 14px;
          border-radius: 999px;
          cursor:pointer;
          transition:.15s ease;
          font-weight:600;
        }
        .tab-btn:hover{ border-color: rgba(255,255,255,.18); transform: translateY(-1px); }
        .tab-btn.active{
         background: linear-gradient(180deg, rgba(59,130,246,.16), rgba(59,130,246,.08));
          border-color: rgba(59,130,246,.35);
          box-shadow: 0 10px 24px rgba(59,130,246,.10);
        }

        /* Content cards */
        .container{
          display:block;
        }
        .tab{
          display:none;
          background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.96));
          border:1px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          padding:18px;
        }
        .tab.visible{ display:block; }

        .tab h3{
          margin:0 0 14px;
          font-size:18px;
        }

        /* Forms grid */
        .form-grid{
          display:grid;
          grid-template-columns: 1fr 1fr;
          gap:14px;
        }
        @media (max-width: 840px){
          .form-grid{ grid-template-columns: 1fr; }
        }

        label{
          display:flex;
          flex-direction:column;
          gap:6px;
          font-size:13px;
          color: var(--muted);
        }

        input, select, textarea{
          width:100%;
          border:1px solid var(--border);
           background:#fff;
          color: var(--text);
          border-radius: 12px;
          padding:10px 12px;
          outline:none;
          transition:.15s ease;
        }
        textarea{ resize: vertical; min-height: 90px; }
        input:focus, select:focus, textarea:focus{
          border-color: rgba(110,168,254,.6);
          box-shadow: 0 0 0 4px rgba(110,168,254,.12);
        }

        .actions{
          display:flex;
          gap:10px;
          flex-wrap:wrap;
          margin-top: 12px;
        }

        .primary-btn{
          border:none;
          background: linear-gradient(180deg, rgba(126,231,135,.95), rgba(126,231,135,.65));
          color:#04120a;
          font-weight:800;
          padding:10px 14px;
          border-radius: 12px;
          cursor:pointer;
          transition:.15s ease;
        }
        .primary-btn:hover{ transform: translateY(-1px); }
        .primary-btn:active{ transform: translateY(0px); }

        .secondary-btn{
          border:1px solid var(--border);
           background:#fff;
          color: var(--text);
          font-weight:700;
          padding:10px 14px;
          border-radius: 12px;
          cursor:pointer;
          transition:.15s ease;
        }
        .secondary-btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.18); }

        .danger-btn{
          background: linear-gradient(180deg, rgba(239,68,68,.18), rgba(239,68,68,.10));
          border:none;
          color:#b91c1c;
          font-weight:800;
          padding:10px 14px;
          border-radius: 12px;
          cursor:pointer;
          transition:.15s ease;
        }

        .danger-btn:hover{
          transform: translateY(-1px);
        }

        /* Schedule list */
        #schedule{
          list-style:none;
          padding:0;
          margin:0 0 10px;
          display:flex;
          flex-direction:column;
          gap:10px;
        }
        #schedule li{
          padding:12px 12px;
          border:1px solid var(--border);
          border-radius: 12px;
          background:#fff;
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:12px;
        }

        .schedule-main{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:16px;
          width:100%;
        }

        .lesson-info{
          display:flex;
          align-items:center;
          gap:12px;
          flex-wrap:wrap;
          min-width:0;
        }

        .lesson-datetime{
          font-weight:600;
        }

        .lesson-status{
          font-size:12px;
          padding:6px 10px;
          border-radius:999px;
          border:1px solid var(--border);
          color:var(--muted);
          background:var(--status-bg);
          white-space:nowrap;
        }

        .lesson-actions{
          display:flex;
          align-items:center;
          gap:8px;
          margin-left:auto;
          flex-shrink:0;
        }

        .subscription-list{
          display:flex;
          flex-direction:column;
          gap:10px;
          margin-top:12px;
        }

        .subscription-item{
          display:flex;
          align-items:center;
          gap:12px;
          flex-wrap:wrap;
          padding:12px;
          border:1px solid var(--border);
          border-radius:12px;
          background:#fff;
        }

        .subscription-item a{
          min-width:0;
          flex:0 1 auto;
        }

        .subscription-tooltip{
          display:inline-flex;
          align-items:center;
          justify-content:center;
          width:28px;
          height:28px;
          border-radius:999px;
          border:1px solid var(--border);
          background:var(--status-bg);
          color:var(--muted);
          font-weight:700;
          cursor:help;
          flex:0 0 auto;
        }

        .subscription-detail-card{
          margin-top:16px;
          width:100%;
          padding:16px;
          border:1px solid var(--border);
          border-radius:12px;
          background:var(--card2);
        }

        .subscription-lessons{
          margin-top:10px;
          padding-left:18px;
        }

        .modal{
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.45);
          display:flex;
          align-items:center;
          justify-content:center;
          z-index:1000;
        }

        .modal.hidden{
          display:none;
        }

        .modal-content{
          background:#fff;
          padding:20px;
          border-radius:12px;
          width:420px;
          max-width:90%;
        }

        /* Small helper */
        .muted{ color: var(--muted); }
    </style>
</head>

<body>
<div class="page">

    <div class="user-panel">
        <div class="user-info">
            <div id="userNameSession">UserName</div>
            <div id="statusSession">Status</div>
        </div>

        <form method="post" action="/logout">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <h1>DanceAssistant</h1>

    <div class="tabs">
        <button id="loadScheduleBtn" class="tab-btn">Schedule</button>
        <button id="loadUserInfoBtn" class="tab-btn">MyInfo</button>
        <button id="loadPaymentBtn" class="tab-btn">Payments and subscriptions</button>
        <button id="loadCalendar" class="tab-btn">Calendar</button>
        <button id="musicServiceBtn" class="tab-btn">Music</button>
    </div>

    <div class="container">
        <div id="scheduleTab" class="tab">
            <h3>Schedule</h3>
            <ul id="schedule"></ul>
            <div class="actions">
                <button id="newLessonBtn" class="primary-btn">Add New Lesson</button>
                <button id="addNewSubscriptionFromScheduleBtn" class="primary-btn">Add new subscription</button>
            </div>
<div class="actions">
            <button id="getTelegramLinkStudentBtn" class="primary-btn">Get Telegram Link</button>
            <a id="tgLink" target="_blank"></a>
</div>
        </div>

        <div id="studentDetails" class="tab">
            <h3>My details</h3>
            <div class="form-grid">
                <label>Name:
                    <input type="text" id="studentName">
                </label>
                <label>Email:
                    <input type="email" id="studentEmail">
                </label>
                <label>Birthday:
                    <input type="date" id="studentBirthday">
                </label>
                <label>Additional info:
                    <textarea id="studentPlans" rows="6"></textarea>
                </label>
            </div>

            <div class="actions">
                <button id="saveChangesStudentBtn" class="primary-btn">Save Changes</button>
            </div>
        </div>

        <div id="paymentDetails" class="tab">
            <h3>Payment details</h3>

            <div class="form-grid">
                <label>Completed Lessons:
                    <textarea id="completedLessons" rows="10"></textarea>
                </label>

                <label>Balance:
                    <input type="number" id="balance">
                </label>

                <label>Month:
                    <select id="monthOfPayment">
                        <option value="JANUARY">JANUARY</option>
                        <option value="FEBRUARY">FEBRUARY</option>
                        <option value="MARCH">MARCH</option>
                        <option value="APRIL">APRIL</option>
                        <option value="MAY">MAY</option>
                        <option value="JUNE">JUNE</option>
                        <option value="JULY">JULY</option>
                        <option value="AUGUST">AUGUST</option>
                        <option value="SEPTEMBER">SEPTEMBER</option>
                        <option value="OCTOBER">OCTOBER</option>
                        <option value="NOVEMBER">NOVEMBER</option>
                        <option value="DECEMBER">DECEMBER</option>
                    </select>
                </label>

                <label>Year:
                    <input type="number" id="yearOfPayment" value="2026">
                </label>
            </div>

            <div class="actions">
                <button id="loadLessonsPaymentBtn" class="secondary-btn">Load Operations</button>
            </div>

            <div id="monthDetails"></div>

            <div style="margin-top:24px;">
                <h3>My subscriptions</h3>
                <div class="actions">
                    <button id="addNewSubscriptionBtn" class="primary-btn">Add new</button>
                </div>
                <div id="subscriptionsList" class="subscription-list"></div>
            </div>
        </div>

        <div id="musicTab" class="tab">
            <h3>Music</h3>
            <div class="muted">Здесь будет твой музыкальный функционал 🙂</div>
        </div>
    </div>

</div>
<div id="newSubscriptionModal" class="modal hidden">
    <div class="modal-content">
        <h3>Add new subscription</h3>
        <label>Trainer:
            <select id="subscriptionTrainerSelect"></select>
        </label>
        <div class="actions">
            <button id="subscriptionTrainerNextBtn" class="primary-btn">Next</button>
            <button id="closeSubscriptionModalBtn" class="secondary-btn">Cancel</button>
        </div>
        <label id="subscriptionTypeBlock" style="display:none; margin-top:16px;">Subscription type:
            <select id="subscriptionTypeSelect"></select>
        </label>
        <label id="subscriptionStartDateBlock" style="display:none; margin-top:16px;">Start date:
            <input type="date" id="subscriptionStartDate">
        </label>
        <div id="subscriptionTypeActions" class="actions" style="display:none;">
            <button id="createSubscriptionBtn" class="primary-btn">Create</button>
        </div>
    </div>
</div>
<script>
    const API_BASE = "/user";

    // ---------- Tab logic ----------
    const tabs = {
      schedule: document.getElementById("scheduleTab"),
      info: document.getElementById("studentDetails"),
      payments: document.getElementById("paymentDetails"),
      music: document.getElementById("musicTab"),
    };

    const buttons = {
      schedule: document.getElementById("loadScheduleBtn"),
      info: document.getElementById("loadUserInfoBtn"),
      payments: document.getElementById("loadPaymentBtn"),
      music: document.getElementById("musicServiceBtn"),
    };

    function showTab(tabKey){
      // hide all tabs
      Object.values(tabs).forEach(t => t.classList.remove("visible"));
      // deactivate all buttons
      Object.values(buttons).forEach(b => b.classList.remove("active"));

      // show selected
      tabs[tabKey].classList.add("visible");
      buttons[tabKey].classList.add("active");
    }

    // Default open
    showTab("schedule");

    // ---------- Buttons ----------
    buttons.schedule.addEventListener("click", async () => {
      showTab("schedule");
      await loadSchedule();
    });

    buttons.info.addEventListener("click", async () => {
      showTab("info");
      await loadThisUser();
    });

    buttons.payments.addEventListener("click", async () => {
      showTab("payments");
      await loadPaymentDetails?.();
      await loadSubscriptions();
    });

    buttons.music.addEventListener("click", async () => {
      showTab("music");
      // тут можешь вызвать loadMusic() если будет
    });

    document.getElementById("loadCalendar").addEventListener("click", () => {
    window.location.href = "calendar.html";
    });

    document.getElementById("newLessonBtn").addEventListener("click", addNewLesson);
    document.getElementById("addNewSubscriptionFromScheduleBtn").addEventListener("click", openNewSubscriptionModal);
    document.getElementById("getTelegramLinkStudentBtn").addEventListener("click", getTelegramLinkStudent);
    document.getElementById("saveChangesStudentBtn").addEventListener("click", saveChangesStudent);
    document.getElementById("addNewSubscriptionBtn").addEventListener("click", openNewSubscriptionModal);
    document.getElementById("closeSubscriptionModalBtn").addEventListener("click", closeNewSubscriptionModal);
    document.getElementById("subscriptionTrainerNextBtn").addEventListener("click", loadTrainerSubscriptionTypes);
    document.getElementById("createSubscriptionBtn").addEventListener("click", createStudentSubscription);

    document.getElementById("loadLessonsPaymentBtn").addEventListener("click", async () => {
      await loadMonthLessonsPaymentDetails?.(); // если у тебя есть функция
      // показать блок деталей месяца (внутри Payments)
      const monthBlock = document.getElementById("monthLessonPaymentDetails");
      if (monthBlock) monthBlock.style.display = "block";
    });

    // ---------- Fix: loadSchedule writes to UL, not to scheduleTab ----------
    async function loadSchedule() {
      const list = document.getElementById("schedule"); // ВАЖНО: ul#schedule
      list.innerHTML = "<li>Loading...</li>";

      try {
        const response = await fetch(API_BASE + "/schedule");
        if (!response.ok) {
          list.innerHTML = "<li>Error loading lessons</li>";
          return;
        }

        const lessons = await response.json();
        list.innerHTML = "";

        if (!lessons || lessons.length === 0) {
          list.innerHTML = "<li>No lessons found</li>";
          return;
        }

        lessons.forEach(lesson => {
          const li = document.createElement("li");

          const wrapper = document.createElement("div");
          wrapper.className = "schedule-main";

          const info = document.createElement("div");
          info.className = "lesson-info";

          const date = document.createElement("div");
          date.className = "lesson-datetime";
          date.textContent = lesson.dateTime;

          const status = document.createElement("div");
          status.className = "lesson-status";

          const actions = document.createElement("div");
          actions.className = "lesson-actions";

          if (lesson.status === "PENDING_STUDENT_CONFIRMATION") {
                status.textContent = "Status: PENDING_STUDENT_CONFIRMATION";
                const confirmBtn = document.createElement("button");
                confirmBtn.textContent = "Confirm";
                confirmBtn.className = "primary-btn";
                confirmBtn.onclick = () => confirmLesson(lesson.lessonId);

                const cancelBtn = document.createElement("button");
                cancelBtn.textContent = "Cancel";
                cancelBtn.className = "danger-btn";
                cancelBtn.onclick = () => cancelLesson(lesson.lessonId);

                actions.appendChild(confirmBtn);
                actions.appendChild(cancelBtn);
          } else if (lesson.status === "PENDING_TRAINER_CONFIRMATION") {
                status.textContent = "Status: PENDING_TRAINER_CONFIRMATION";
                const cancelBtn = document.createElement("button");
                cancelBtn.textContent = "Cancel";
                cancelBtn.className = "danger-btn";
                cancelBtn.onclick = () => cancelLesson(lesson.id);

                actions.appendChild(cancelBtn);
          } else {
                status.textContent  = "Status: " + lesson.status ?? "Unknown";
          }

        info.appendChild(date);
        info.appendChild(status);

        wrapper.appendChild(info);
        wrapper.appendChild(actions);

        li.appendChild(wrapper);
        list.appendChild(li);
        });

      } catch (error) {
        console.error(error);
        list.innerHTML = "<li>Error loading lessons</li>";
      }
    }

    async function getTelegramLinkStudent() {
        try {
            const response = await fetch(API_BASE + "/telegram_link");
            const data = await response.json();
            if (data.link) {
                window.open(data.link, "_blank");
            } else {
                alert("Telegram link not found");
            }
        } catch (error) {
            console.error("Error fetching Telegram link:", error);
             alert("Failed to fetch Telegram link.");
        }
    }

    async function confirmLesson(id) {
        const csrf = decodeURIComponent(getCookie("XSRF-TOKEN") || "");

        try {
            const res = await fetch(`/user/confirm_lesson/${id}`, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-XSRF-TOKEN": csrf
                }
            });

            if (!res.ok) {
                throw new Error("Failed to confirm lesson");
            }

            console.log("Lesson confirmed:", id);
            loadSchedule();

        } catch (err) {
            console.error("Confirm error:", err);
            alert("Error confirming lesson");
        }
    }

    async function cancelLesson(id) {
        const csrf = decodeURIComponent(getCookie("XSRF-TOKEN") || "");

        try {
            const res = await fetch(`/user/cancel_lesson/${id}`, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-XSRF-TOKEN": csrf
                }
            });

            if (!res.ok) {
                throw new Error("Failed to cancel lesson");
            }

            console.log("Lesson cancelled:", id);
            loadSchedule();

        } catch (err) {
            console.error("Cancel error:", err);
            alert("Error cancelling lesson");
        }
    }



    async function loadThisUser() {
      try {
        const response = await fetch(API_BASE + "/my_info");
        const student = await response.json();

        document.getElementById("studentName").value = student.name ?? "";
        document.getElementById("studentEmail").value = student.email ?? "";
        document.getElementById("studentBirthday").value = student.birthday ?? "";
        document.getElementById("studentPlans").value = student.additionalInfo ?? "";
      } catch (error) {
        console.error("Error loading student:", error);
      }
    }

    async function saveChangesStudent() {
      const csrf = decodeURIComponent(getCookie("XSRF-TOKEN") || "");

      const studentData = {
        name: document.getElementById("studentName").value,
        email: document.getElementById("studentEmail").value,
        birthday: document.getElementById("studentBirthday").value
      };

      try {
        const response = await fetch(API_BASE + "/change", {
          method: "PUT",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-XSRF-TOKEN": csrf
          },
          body: JSON.stringify(studentData)
        });

        if (!response.ok) {
          console.error("Error:", response.status, response.statusText);
          alert("Не удалось обновить пользователя");
          return;
        }
        alert("Data updated successfully.");
      } catch (error) {
        console.error("Error:", error);
        alert("Error updating data.");
      }
    }

    async function loadPaymentDetails() {
  try {
    const response = await fetch(API_BASE + "/to_pay");
    if (!response.ok) {
      throw new Error("Failed to load payment info");
    }

    const paymentInfo = await response.json();

    document.getElementById("completedLessons").value =
      (paymentInfo.completedLessons ?? []).join("\n");

    document.getElementById("balance").value =
      paymentInfo.balance ?? 0;

  } catch (error) {
    console.error("Error loading payment details:", error);
    alert("Error loading payment details");
  }
}

    function openNewSubscriptionModal() {
      document.getElementById("subscriptionTrainerSelect").innerHTML = "";
      document.getElementById("subscriptionTypeSelect").innerHTML = "";
      document.getElementById("subscriptionTypeBlock").style.display = "none";
      document.getElementById("subscriptionStartDateBlock").style.display = "none";
      document.getElementById("subscriptionTypeActions").style.display = "none";
      document.getElementById("subscriptionStartDate").value = todayIsoDate();
      document.getElementById("newSubscriptionModal").classList.remove("hidden");
      loadStudentTrainers();
    }

    function closeNewSubscriptionModal() {
      document.getElementById("newSubscriptionModal").classList.add("hidden");
    }

    function closeSubscriptionFullInfo() {
      document.querySelectorAll(".subscription-item .subscription-detail-card").forEach(card => card.remove());
    }

    function getSubscriptionTypeId(item) {
      return item.SubscriptionTypeId ?? item.subscriptionTypeId ?? item.id ?? null;
    }

    function getSubscriptionTypeText(item) {
      return item.SubscriptionTypeString ?? item.subscriptionTypeString ?? item.info ?? "";
    }

    function todayIsoDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    async function loadStudentTrainers() {
      const select = document.getElementById("subscriptionTrainerSelect");
      select.innerHTML = "<option value=\"\">Choose trainer</option>";

      try {
        const response = await fetch(API_BASE +"/trainers", {
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Failed to load trainers");
        }

        const trainers = await response.json();
        (trainers ?? []).forEach(trainer => {
          const option = document.createElement("option");
          option.value = trainer.id;
          option.textContent = trainer.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error("Error loading trainers:", error);
        alert("Failed to load trainers");
      }
    }

    async function loadTrainerSubscriptionTypes() {
      const trainerId = document.getElementById("subscriptionTrainerSelect").value;
      const select = document.getElementById("subscriptionTypeSelect");

      if (!trainerId) {
        alert("Choose trainer");
        return;
      }

      select.innerHTML = "<option value=\"\">Choose subscription type</option>";

      try {
        const response = await fetch(API_BASE+"/trainer/" + trainerId + "/subscription_types", {
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Failed to load subscription types");
        }

        const subscriptionTypes = await response.json();
        (subscriptionTypes ?? []).forEach(item => {
          const option = document.createElement("option");
          option.value = getSubscriptionTypeId(item);
          option.textContent = getSubscriptionTypeText(item);
          select.appendChild(option);
        });

        document.getElementById("subscriptionTypeBlock").style.display = "flex";
        document.getElementById("subscriptionStartDateBlock").style.display = "flex";
        document.getElementById("subscriptionTypeActions").style.display = "flex";
      } catch (error) {
        console.error("Error loading trainer subscription types:", error);
        alert("Failed to load subscription types");
      }
    }

    async function createStudentSubscription() {
      const csrf = decodeURIComponent(getCookie("XSRF-TOKEN") || "");
      const subscriptionTypeId = document.getElementById("subscriptionTypeSelect").value;
      const startDate = document.getElementById("subscriptionStartDate").value;

      if (!subscriptionTypeId) {
        alert("Choose subscription type");
        return;
      }

      if (!startDate) {
        alert("Choose start date");
        return;
      }

      try {
        const body = {
          subscriptionTypeId: Number(subscriptionTypeId),
          startDate: startDate
        };

        const response = await fetch(API_BASE+"/subscription/new", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-XSRF-TOKEN": csrf
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          throw new Error("Failed to create subscription");
        }

        const subscriptionInfo = (await response.text()).trim();
        closeNewSubscriptionModal();
        let successMessage = "The subscription has been created. Please wait for payment instructions. Please book your lesson times in advance.";
        if (subscriptionInfo) {
          successMessage += "\n" + subscriptionInfo;
        }
        alert(successMessage);
        await loadSubscriptions();
      } catch (error) {
        console.error("Error creating subscription:", error);
        alert("Failed to create subscription");
      }
    }

    function renderSubscriptions(subscriptions) {
      const container = document.getElementById("subscriptionsList");
      container.innerHTML = "";

      if (!subscriptions || subscriptions.length === 0) {
        return;
      }

      subscriptions.forEach(subscription => {
        const item = document.createElement("div");
        item.className = "subscription-item";

        const link = document.createElement("a");
        link.href = "#";
        link.textContent = subscription.info ?? "Subscription";
        link.addEventListener("click", async (event) => {
          event.preventDefault();
          await loadSubscriptionFullInfo(subscription.id, item);
        });

        const tooltip = document.createElement("span");
        tooltip.className = "subscription-tooltip";
        tooltip.textContent = "i";
        tooltip.title = subscription.subscriptionTypeInfo ?? "";

        item.appendChild(link);
        item.appendChild(tooltip);
        container.appendChild(item);
      });
    }

    async function loadSubscriptions() {
      const container = document.getElementById("subscriptionsList");
      container.innerHTML = "";
      closeSubscriptionFullInfo();

      try {
        const response = await fetch(API_BASE+"/subscriptions", {
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Failed to load subscriptions");
        }

        const subscriptions = await response.json();
        renderSubscriptions(subscriptions);
      } catch (error) {
        console.error("Error loading subscriptions:", error);
      }
    }

    async function loadSubscriptionFullInfo(subscriptionId, subscriptionItem) {
      const existingDetail = subscriptionItem.querySelector(".subscription-detail-card");
      if (existingDetail) {
        existingDetail.remove();
        return;
      }

      try {
        const response = await fetch(API_BASE+"/subscription/" + subscriptionId, {
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Failed to load subscription");
        }

        const lessons = await response.json();
        closeSubscriptionFullInfo();

        const detailCard = document.createElement("div");
        detailCard.className = "subscription-detail-card";

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.style.justifyContent = "flex-end";
        actions.style.marginTop = "0";

        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.className = "secondary-btn";
        closeButton.textContent = "Close";
        closeButton.addEventListener("click", closeSubscriptionFullInfo);
        actions.appendChild(closeButton);

        const content = document.createElement("div");
        content.innerHTML = `<div style="margin-top:10px;"><strong>Lessons:</strong></div>`;

        const lessonList = document.createElement("ul");
        lessonList.className = "subscription-lessons";
        (lessons ?? []).forEach(lesson => {
          const li = document.createElement("li");
          li.textContent = `${lesson.dateTime ?? ""} ${lesson.status ?? ""}`.trim();
          lessonList.appendChild(li);
        });
        content.appendChild(lessonList);
        detailCard.appendChild(actions);
        detailCard.appendChild(content);
        subscriptionItem.appendChild(detailCard);
      } catch (error) {
        console.error("Error loading subscription full info:", error);
        alert("Failed to load subscription");
      }
    }

// ---------- Payment: month details ----------
    async function loadMonthLessonsPaymentDetails() {
      const month = document.getElementById("monthOfPayment").value;
      const year = document.getElementById("yearOfPayment").value;

      try {
        const response = await fetch(
          API_BASE+'/month_details/'+month+'/'+year
        );

        if (!response.ok) {
          throw new Error("Failed to load month details");
        }

        const monthDetails = await response.json();

        const container = document.getElementById("monthDetails");
        container.innerHTML = "";
        monthDetails.forEach(item => {
          const row = document.createElement("div");
          row.textContent = `${item.date} - ${item.type} : ${item.amount}`;
          container.appendChild(row);
        });

      } catch (error) {
        console.error("Error loading month lessons and payment details:", error);
        alert("Error loading month details");
      }
    }

    function getCookie(name) {
      const m = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
      return m ? decodeURIComponent(m[2]) : null;
    }

    async function loadMe() {
      const res = await fetch("/api/me");
      if (res.status === 401) {
        window.location.href = "/index.html";
        return;
      }
      const data = await res.json();
      document.getElementById("userNameSession").textContent = data.userName;
      document.getElementById("statusSession").textContent = data.status;
    }

    loadMe();
    loadSchedule();

    function addNewLesson(){ window.location.href = "calendar.html?openAddLesson=true"; }
</script>

</body>
</html>
